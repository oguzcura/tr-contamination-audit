[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tr-contamination-audit"
version = "0.1.0"
description = "Multi-benchmark contamination audit of Turkish LLM benchmarks (M1/M2/M3 probes, black-box API)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oğuz Emre Cura" }]
keywords = ["nlp", "llm", "turkish", "benchmark", "contamination", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=2.19",
    "openai>=1.30",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["harness/src"]

[tool.ruff]
line-length = 100
